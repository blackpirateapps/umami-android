name: Build release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-apk:
    name: Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding
        run: flutter create --platforms android --project-name umami_android --org app.blackpirate.umami .

      - name: Configure Android network access
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest_path.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'

          if "android.permission.INTERNET" not in text:
              text = text.replace("    <application", permission + "\n    <application", 1)
              manifest_path.write_text(text)
          PY

      - name: Install release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "$name is required."
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          chmod 600 android/app/release.jks

          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=release.jks"
          } > android/key.properties

      - name: Verify release keystore credentials
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          keytool -list \
            -keystore android/app/release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          keytool -certreq \
            -keystore android/app/release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/release-key.csr" \
            >/dev/null

      - name: Configure Android release signing
        run: |
          python3 <<'PY'
          from pathlib import Path

          kotlin_path = Path("android/app/build.gradle.kts")
          groovy_path = Path("android/app/build.gradle")

          if kotlin_path.exists():
              path = kotlin_path
              text = path.read_text()
              imports = "import java.io.FileInputStream\nimport java.util.Properties\n\n"
              props = """val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """
              signing = """    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          """
              if "keystoreProperties" not in text:
                  text = imports + text
                  text = text.replace("android {\n", props + "android {\n", 1)
              if 'create("release")' not in text:
                  text = text.replace("android {\n", "android {\n" + signing, 1)
              text = text.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")',
              )
              path.write_text(text)
          elif groovy_path.exists():
              path = groovy_path
              text = path.read_text()
              props = """def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          """
              signing = """    signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }

          """
              if "keystoreProperties" not in text:
                  text = "import java.util.Properties\nimport java.io.FileInputStream\n\n" + text
                  text = text.replace("android {\n", props + "android {\n", 1)
              if "keyAlias keystoreProperties" not in text:
                  text = text.replace("android {\n", "android {\n" + signing, 1)
              text = text.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release",
              )
              path.write_text(text)
          else:
              raise SystemExit("No Android app Gradle file found after flutter create.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Dart code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: umami-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
